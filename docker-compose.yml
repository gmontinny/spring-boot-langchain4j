services:
  postgres:
    image: postgres:16-alpine
    container_name: langchain4j-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: langchain4j_db
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-gmontinny}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-Gmontinny2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmontinny -d langchain4j_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: langchain4j-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
